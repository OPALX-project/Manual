<style>
  .feature-toggle {
    display: flex;
    gap: 0.9rem;
    align-items: center;
    flex-wrap: wrap;
    margin: 0.4rem 0 1.2rem;
    padding: 0.75rem 0.9rem;
    border: 1px solid #d9dee7;
    border-radius: 0.6rem;
    background: #f7f9fc;
  }

  .feature-toggle span {
    font-weight: 600;
  }

  .feature-choice {
    display: inline-flex;
    gap: 0.35rem;
    align-items: center;
    font-size: 0.95rem;
  }

  .feature-opal,
  .feature-opalx {
    margin: 0.8rem 0;
    padding: 0.85rem 1rem;
    border-left: 0.3rem solid #c7d2e5;
    background: #fafbfd;
  }

  .feature-opal {
    border-left-color: #2b6cb0;
  }

  .feature-opalx {
    border-left-color: #2f855a;
  }

  html[data-feature-mode="opal"] .feature-opalx {
    display: none;
  }

  html[data-feature-mode="opalx"] .feature-opal {
    display: none;
  }
</style>

<script>
  (function () {
    var STORAGE_KEY = "feature-mode";
    var pendingInitialMode = "both";

    function syncRadios(mode) {
      var radios = document.querySelectorAll(".feature-toggle input[name='feature-mode']");
      radios.forEach(function (r) {
        r.checked = r.value === mode;
      });
    }

    function setMode(mode) {
      document.documentElement.setAttribute("data-feature-mode", mode);
      syncRadios(mode);
      try {
        localStorage.setItem(STORAGE_KEY, mode);
      } catch (err) {
      }
    }

    window.setFeatureMode = setMode;

    document.addEventListener("DOMContentLoaded", function () {
      try {
        pendingInitialMode = localStorage.getItem(STORAGE_KEY) || "both";
      } catch (err) {
      }

      var radios = document.querySelectorAll(".feature-toggle input[name='feature-mode']");
      radios.forEach(function (r) {
        r.addEventListener("change", function (ev) {
          setMode(ev.target.value);
        });
      });
    });

    window.addEventListener("load", function () {
      setMode(pendingInitialMode);
    });
  })();
</script>
